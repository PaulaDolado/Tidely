# Render Blueprint — despliegue declarativo (Render > New > Blueprint, apunta a este repo)
# Docs: https://render.com/docs/blueprint-spec
#
# Sin bloque `databases:` a propósito: la base de datos es Supabase (ver
# DEPLOYMENT.md#usar-supabase-como-postgres), no el Postgres propio de Render — así que
# DATABASE_URL/DIRECT_URL van como `sync: false` (sin valor aquí, Render los pide al crear el
# Blueprint y los guarda como secretos del servicio, nunca en este fichero versionado).
services:
  - type: web
    name: life-organizer-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Pooled (puerto 6543, con ?pgbouncer=true) — la usa Prisma Client en tiempo de ejecución.
      - key: DATABASE_URL
        sync: false
      # Directa/session pooler (puerto 5432) — la usa `prisma migrate deploy` en cada arranque del
      # contenedor (ver Dockerfile); el modo transacción de arriba rompe los advisory locks que
      # necesita migrar.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "https://pauladolado.github.io" # dashboard en GitHub Pages — ver deploy-pages.yml
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "100"
