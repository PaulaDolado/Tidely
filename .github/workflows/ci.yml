name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Los cambios entran en main por pull request (ver CONTRIBUTING.md): estos jobs son los "checks obligatorios" de la
# rama protegida — test, build, build-dashboard y mobile tienen que estar en verde para poder fusionar.
permissions:
  contents: read

# Un push nuevo a la misma PR cancela la ejecución anterior (ya obsoleta); en main nunca se cancela, para que cada
# fusión conserve su resultado.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Los jobs usan ubuntu-24.04 y no ubuntu-latest a propósito: ubuntu-latest pasa a Ubuntu 26 a partir del 19/10/2026 y un
# cambio de imagen no debe romper el CI de una PR cualquiera por sorpresa. Se migra cuando se decida, probándolo antes.
jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: life_organizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/life_organizer_test
      # Sin pooler en el contenedor de CI — misma cadena que DATABASE_URL. Necesaria porque
      # "Run database migrations" (más abajo) usa `prisma migrate deploy`, que requiere DIRECT_URL
      # (ver prisma/schema.prisma).
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/life_organizer_test
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      # Para el unit test de src/utils/encryption.ts (cifra los tokens de Google Calendar en
      # reposo) — no hace falta que sea secreta de verdad, solo 32 bytes válidos en base64
      # (ver getKey() ahí); ningún test conecta con Google de verdad.
      ENCRYPTION_KEY: "C966/TP07IfI3BoOYlZ0epw0oZFXZM5n0kmOw1JsX/o="
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run database migrations
        run: npx prisma migrate deploy

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build API
        run: npm run build

  build-dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      # ESLint del dashboard (react-hooks incluido, ver dashboard/.eslintrc.cjs): el build solo hace tsc + vite.
      - name: Lint dashboard
        working-directory: dashboard
        run: npm run lint

      - name: Build dashboard
        working-directory: dashboard
        env:
          VITE_API_URL: https://placeholder.example.com
        run: npm run build

  # La app móvil no tenía ninguna comprobación en CI: un error de tipos solo salía al compilar el APK (≈15 min después
  # de etiquetar una versión). Aquí se detecta en la propia PR.
  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile
        working-directory: mobile
        run: npx tsc --noEmit
