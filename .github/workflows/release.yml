# Publica una versión nueva de la app móvil (.apk) y de escritorio (.msi) como GitHub Release, al
# empujar un tag "v*" (p.ej. `git tag v1.0.1 && git push origin v1.0.1`) — no en cada push a main,
# a propósito: compilar el .msi (Rust) y el .apk (Gradle) tarda varios minutos cada uno, así que
# solo tiene sentido cuando de verdad hay una versión nueva que publicar, no en cada commit.
#
# El asset de cada Release se llama SIEMPRE igual (Tidely.apk / Tidely-Setup.msi,
# independientemente del tag) para que la URL "latest" de GitHub sea estable entre versiones:
#   https://github.com/<owner>/<repo>/releases/latest/download/Tidely.apk
#   https://github.com/<owner>/<repo>/releases/latest/download/Tidely-Setup.msi
# Esas dos URLs son las que usa el menú de descarga del dashboard (ver MOBILE_APK_URL/
# DESKTOP_MSI_URL en dashboard/src/components/AppShell.tsx) — apuntan siempre a la versión más
# reciente sin tener que tocar código en cada release.
#
# El .apk se compila con Gradle directamente (expo prebuild + ./gradlew assembleRelease), NO con
# EAS Build — a propósito, para no depender de ninguna cuenta/token de Expo: `expo prebuild` es
# una operación local del CLI (genera el proyecto nativo `android/` a partir de app.json), no
# toca ningún servicio de Expo. El .apk queda firmado con el keystore de "debug" que trae el
# propio proyecto generado (así firma por defecto `assembleRelease` en cualquier proyecto
# React Native si no se configura un keystore de release propio) — válido para instalar
# directamente (sideload/QR), no para publicarlo en Play Store.
name: Publicar release (APK + MSI)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      # React Native 0.86 (Expo SDK 57) necesita JDK 17 para compilar el proyecto Android.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Cachea dependencias de Gradle entre ejecuciones (equivalente al cache: "npm" de arriba,
      # pero para el build nativo) — sin esto, cada release volvería a descargar/compilar todo el
      # árbol de Gradle desde cero.
      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci

      # Genera el proyecto nativo `android/` a partir de app.json (gitignored, se regenera en
      # cada run) — es un comando local del CLI de Expo, no requiere sesión ni token de ninguna
      # cuenta. `EXPO_PUBLIC_API_URL` tiene que estar puesta YA aquí (no solo en el paso de
      # compilar): Metro la incrusta en el JS del bundle cuando Gradle invoca el bundling, así que
      # tiene que seguir exportada en el paso siguiente también.
      - name: Generar el proyecto nativo de Android
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: https://tidely-api-pa09.onrender.com
        run: npx expo prebuild --platform android --non-interactive

      # Por si el proyecto pide una API level del SDK que el runner no trae por defecto — no-op
      # (con licencias ya aceptadas) si todo lo necesario ya está instalado.
      - name: Aceptar licencias del Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Un .apk por arquitectura en vez de uno "universal" con las 4 a la vez — reduce bastante el
      # tamaño de descarga (un móvil normal solo necesita UNA). `-PreactNativeArchitectures=<abi>`
      # es la propiedad que ya trae el propio gradle.properties generado (ver el comentario junto a
      # `reactNativeArchitectures` ahí) para filtrar qué librerías nativas empaquetar; `clean` entre
      # cada arquitectura evita que la caché incremental de Gradle deje colada alguna librería de
      # la vuelta anterior. `Tidely.apk` (sin sufijo) es una copia de arm64-v8a — la arquitectura de
      # prácticamente cualquier móvil Android de los últimos ~8 años — y es la que usa el QR/enlace
      # por defecto del dashboard (ver MOBILE_APK_URL en AppShell.tsx); las demás quedan también
      # publicadas en el Release por si alguien las necesita.
      - name: Compilar un .apk por arquitectura
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: https://tidely-api-pa09.onrender.com
        run: |
          chmod +x gradlew
          mkdir -p ../../dist-apks
          for arch in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "== Compilando $arch =="
            ./gradlew assembleRelease -PreactNativeArchitectures=$arch --no-daemon
            apk=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
            cp "$apk" "../../dist-apks/Tidely-$arch.apk"
            ./gradlew clean --no-daemon
          done
          cp ../../dist-apks/Tidely-arm64-v8a.apk ../../dist-apks/Tidely.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist-apks/*.apk

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      # Cachea el registro de crates + `target/` entre ejecuciones (misma idea que cache: "npm" de
      # arriba, pero para Rust) — sin esto, cada release recompilaría TODAS las dependencias de
      # Tauri desde cero (bastantes minutos más), en vez de solo lo que haya cambiado.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dashboard/src-tauri

      - name: Instalar dependencias
        working-directory: dashboard
        run: npm ci

      # El build de Tauri empaqueta `dashboard/dist`, que a su vez incrusta VITE_API_URL en tiempo
      # de compilación (no se puede cambiar después sin recompilar, ver comentario en
      # dashboard/.env.example) — tiene que apuntar a la API ya desplegada, nunca a localhost.
      - name: Apuntar el build a la API de producción
        working-directory: dashboard
        shell: bash
        run: echo "VITE_API_URL=https://tidely-api-pa09.onrender.com" > .env

      - name: Compilar el instalador de Windows
        working-directory: dashboard
        run: npm run tauri:build

      - name: Renombrar el instalador
        shell: bash
        run: |
          msi=$(find dashboard/src-tauri/target/release/bundle/msi -name "*.msi" | head -n1)
          cp "$msi" Tidely-Setup.msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: Tidely-Setup.msi

  release:
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: windows-msi
          path: dist

      # `files:` con nombres fijos (Tidely.apk/Tidely-Setup.msi) — es justo lo que hace que la URL
      # ".../releases/latest/download/..." sea estable entre versiones, ver el comentario de arriba
      # del todo. `generate_release_notes: true` rellena el cuerpo del Release solo, a partir de
      # los commits desde el tag anterior.
      - name: Crear el Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/Tidely-Setup.msi
          generate_release_notes: true
